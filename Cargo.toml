[workspace]
members = ["."]

[package]
name = "price"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "3.1.1"
comfy-table = "7.2.2"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
format_num = "0.1.0"
num-format = "0.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
# sea-orm = { version = "2.0.1", features = [
#   "sqlx-sqlite",
#   "runtime-tokio",
#   "macros",
# ] }
chrono = "0.4.45"
parsidate = {version = "1", features = ["serde"]}
rusqlite = { version = "0.40.1", features = ["bundled"] }

dotenvy = "0.15"
